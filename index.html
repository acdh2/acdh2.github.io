<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digiboard Navigatie</title>
    <style>
        body {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .block {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: sans-serif;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 12px;
            user-select: none;
            cursor: pointer;
        }
        .red {
            background-color: #e74c3c;
        }
        .green {
            background-color: #2ecc71;
        }
    </style>
</head>
<body>

    <a href="https://sites.google.com/view/labtoolkit/page1" target="_top" class="block red">Page 1</a>
    <a href="https://sites.google.com/view/labtoolkit/page2" target="_top" class="block red">Page 2</a>

</body>
</html>
