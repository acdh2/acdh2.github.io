<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDT Cirkel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="startpagina">

  <header class="header-container">
    <img src="logo1.png" alt="Logo Links" class="logo" onerror="this.style.visibility='hidden'">
    <h1 class="title-text">Waar zit je in het ontwerpproces?</h1>
    <img src="logo2.png" alt="Logo Rechts" class="logo logo-right" onerror="this.style.visibility='hidden'">
  </header>

  <main class="wheel-wrapper">
    <svg class="wheel-svg" viewBox="0 0 400 400">
      <defs>
        <g id="wheel-paths">
          <!-- Geel (Inleven) -> page5.html -->
          <a href="page5.html" class="segment-link" target="_top">
            <path class="wheel-segment" fill="#fed100" d="M 200 200 L 28.81 144.38 A 180 180 0 0 1 200 20 Z"/>
          </a>
          <!-- Oranje (Definiëren) -> page1.html -->
          <a href="page1.html" class="segment-link" target="_top">
            <path class="wheel-segment" fill="#f59c23" d="M 200 200 L 200 20 A 180 180 0 0 1 371.19 144.38 Z"/>
          </a>
          <!-- Magenta (Idee) -> page2.html -->
          <a href="page2.html" class="segment-link" target="_top">
            <path class="wheel-segment" fill="#c81358" d="M 200 200 L 371.19 144.38 A 180 180 0 0 1 305.80 345.62 Z"/>
          </a>
          <!-- Blauw (Prototype) -> page3.html -->
          <a href="page3.html" class="segment-link" target="_top">
            <path class="wheel-segment" fill="#50a0ff" d="M 200 200 L 305.80 345.62 A 180 180 0 0 1 94.20 345.62 Z"/>
          </a>
          <!-- Groen (Testen) -> page4.html -->
          <a href="page4.html" class="segment-link" target="_top">
            <path class="wheel-segment" fill="#0a9b6c" d="M 200 200 L 94.20 345.62 A 180 180 0 0 1 28.81 144.38 Z"/>
          </a>
        </g>
      </defs>

      <use href="#wheel-paths" />

      <!-- Witte binnencirkel -->
      <circle cx="200" cy="200" r="75" fill="#ffffff" />

      <!-- Tekstlaag (recht geplaatst in het midden van elk segment) -->
      <g id="wheel-texts">
        <a href="page1.html" class="segment-link">
          <text x="273.5" y="99.1" class="segment-text">Definiëren</text>
        </a>
        <a href="page2.html" class="segment-link">
          <text x="302.2" y="238.6" class="segment-text">Idee</text>
        </a>
        <a href="page3.html" class="segment-link">
          <text x="200" y="325" class="segment-text">Prototype</text>
        </a>
        <a href="page4.html" class="segment-link">
          <text x="97.8" y="238.6" class="segment-text">Testen</text>
        </a>
        <a href="page5.html" class="segment-link">
          <text x="126.5" y="99.1" class="segment-text">Inleven</text>
        </a>
      </g>
    </svg>
  </main>

</body>
</html>
