<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IDT Cirkel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="startpagina">

  <header class="header-container">
    <img src="logo1.svg" alt="Logo Links" class="logo" onerror="this.style.visibility='hidden'">
    <h1 class="title-text">Waar in het ontwerpproces zit jij?</h1>
    <img src="logo2.svg" alt="Logo Rechts" class="logo logo-right" onerror="this.style.visibility='hidden'">
  </header>

  <main class="wheel-wrapper">
    <svg class="wheel-svg" viewBox="0 0 400 400">
      <!-- Witte rand rond het wiel -->
      <circle cx="200" cy="200" r="187" fill="#ffffff" />

      <!-- De vijf fasen, met de klok mee vanaf boven -->
      <a href="doelgroep-ontdekken/index.html" class="segment-link">
        <path class="wheel-segment" fill="#fcdc0e" d="M 200 200 L 200 20 A 180 180 0 0 1 371.19 144.38 Z"/>
      </a>
      <a href="kaders-stellen/index.html" class="segment-link">
        <path class="wheel-segment" fill="#f2aa28" d="M 200 200 L 371.19 144.38 A 180 180 0 0 1 305.80 345.62 Z"/>
      </a>
      <a href="idee-bedenken/index.html" class="segment-link">
        <path class="wheel-segment" fill="#96d0e6" d="M 200 200 L 305.80 345.62 A 180 180 0 0 1 94.20 345.62 Z"/>
      </a>
      <a href="ontwerp-testen/index.html" class="segment-link">
        <path class="wheel-segment" fill="#0a997d" d="M 200 200 L 94.20 345.62 A 180 180 0 0 1 28.81 144.38 Z"/>
      </a>
      <a href="ontwerp-bewijzen/index.html" class="segment-link">
        <path class="wheel-segment" fill="#cf0852" d="M 200 200 L 28.81 144.38 A 180 180 0 0 1 200 20 Z"/>
      </a>

      <!-- Witte binnencirkel met "Je bevindt je hier" -->
      <circle cx="200" cy="200" r="65" fill="#ffffff" />
      <path class="wheel-pin" d="M 200 211 C 190 199 176 190 176 178 A 24 24 0 1 1 224 178 C 224 190 210 199 200 211 Z" />
      <circle cx="200" cy="178" r="10.5" fill="#ffffff" />
      <text x="200" y="224" class="wheel-hier">Je bevindt je hier</text>

      <!-- Teksten in het midden van elk segment (klikken gaat naar het segment eronder) -->
      <text x="270" y="103.7" class="segment-text"><tspan x="270" dy="-13">Doelgroep</tspan><tspan x="270" dy="26">ontdekken</tspan></text>
      <text x="313.2" y="236.8" class="segment-text"><tspan x="313.2" dy="-13">Kaders</tspan><tspan x="313.2" dy="26">stellen</tspan></text>
      <text x="200" y="319" class="segment-text"><tspan x="200" dy="-13">Idee</tspan><tspan x="200" dy="26">bedenken</tspan></text>
      <text x="86.8" y="236.8" class="segment-text"><tspan x="86.8" dy="-13">Ontwerp</tspan><tspan x="86.8" dy="26">testen</tspan></text>
      <text x="130" y="103.7" class="segment-text"><tspan x="130" dy="-13">Ontwerp</tspan><tspan x="130" dy="26">bewijzen</tspan></text>
    </svg>
  </main>

</body>
</html>
