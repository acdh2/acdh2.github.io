<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Pagina</title>
  <script src="js/qrcode.min.js"></script>
  <style>
    :root {
      /* Breedte van de inhoud: volledig scherm, maar nooit breder dan 9:16 (portret) */
      --page-width: min(100vw, 100vh * 9 / 16);
    }

    @supports (height: 100dvh) {
      :root { --page-width: min(100vw, 100dvh * 9 / 16); }
    }

    /* Alle maten in rem schalen mee met de paginabreedte (minimaal 16px voor mobiel) */
    html {
      font-size: max(16px, calc(var(--page-width) / 40));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #8cd0ea;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem;
      font-family: Arial, Helvetica, sans-serif;
    }

    .header-container {
      width: 100%;
      max-width: var(--page-width);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .logo {
      height: 3.75rem;
      width: auto;
      object-fit: contain;
    }

    .logo-right {
      justify-self: end;
    }

    .title-text {
      font-size: 2rem;
      font-weight: bold;
      color: #ffffff;
      text-align: center;
      word-break: break-all;
      filter: drop-shadow(0px 1px 2px rgba(0, 0, 0, 0.7)); 
    }

    .qr-wrapper {
      --qr-size: min(calc(var(--page-width) * 0.75), calc(100vh - 12rem));
      width: var(--qr-size);
      height: var(--qr-size);
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      padding: 1.25rem;
      border-radius: 1rem;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    }

    #qrcode {
      width: 100%;
    }

    /* De QR-code wordt scherp gegenereerd en hier op maat geschaald */
    #qrcode img, #qrcode canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      .logo { height: 2.75rem; }
      .title-text { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <header class="header-container">
    <img src="logo1.png" alt="Logo Links" class="logo" onerror="this.style.visibility='hidden'">
    <div id="target-link" class="title-text">https://example.com</div>
    <img src="logo2.png" alt="Logo Rechts" class="logo logo-right" onerror="this.style.visibility='hidden'">
  </header>

  <main class="qr-wrapper">
    <div id="qrcode"></div>
  </main>

  <script>
    const targetUrl = document.getElementById('target-link').innerText;

    new QRCode(document.getElementById('qrcode'), {
      text: targetUrl,
      width: 512,
      height: 512,
      colorDark : "#000000",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
